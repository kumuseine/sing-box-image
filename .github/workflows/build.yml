name: Sync Upstream & Build Docker

on:
  schedule:
    - cron: '0 18 * * *' # 每天北京时间凌晨 2:00 自动检查上游脚本
  workflow_dispatch:     # 网页上手动点击立即运行
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

# 权限配置：写代码库（用于同步）+ 写容器包（用于 GHCR）
permissions:
  contents: write
  packages: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check-script.outputs.needs_build }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史比对

      - name: Configure Git Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 检查并同步 fscarmen/sing-box 脚本上游（沙盒隔离上游的所有工作流）
      - name: Check and Sync Script Upstream
        id: check-script
        run: |
          git remote add upstream https://github.com/fscarmen/sing-box.git || true
          git fetch upstream main

          # 比对上游 Commit 差异
          NEW_COMMITS=$(git rev-list HEAD..upstream/main --count)
          echo "Upstream commits count: $NEW_COMMITS"

          if [ "$NEW_COMMITS" -gt 0 ]; then
            echo "Upstream updates detected! Merging with workflow isolation..."

            # 执行合并不自动提交
            git merge --no-commit --no-ff upstream/main || true

            # 核心防御：彻底还原 .github 目录，阻断上游的 mirror.yml 等无用工作流
            git reset HEAD .github/
            git checkout HEAD -- .github/
            git clean -fd .github/
            rm -f .github/workflows/mirror.yml

            # 判定：剔除上游 CI 后，是否有实际项目代码改动（Dockerfile, docker_init.sh 等）
            if ! git diff --cached --quiet || ! git diff --quiet; then
              echo "Legitimate code changes detected. Committing..."
              git add -A
              git commit -m "chore: auto-sync upstream (exclude upstream workflows) [skip ci]"
              git push origin main
              echo "needs_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Upstream only modified workflows/CI. No actual code changed."
              git merge --abort || true
              echo "needs_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No changes in upstream script repo."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check-and-sync
    # 门禁条件：脚本有更新、手动在网页触发、或你自己手动提交代码时才运行构建
    if: |
      needs.check-and-sync.outputs.needs_build == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 安装 QEMU 以支持多架构 (AMD64 & ARM64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动生成镜像 Tags (latest 与 commit short sha)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 构建并推送双架构镜像，带 GHA 缓存极速复用
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 自动清理旧镜像，保留最新的 10 个副本
      - name: Cleanup old container images (Keep 10)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-tagged: 10
          delete-untagged: true
          delete-partial-images: true