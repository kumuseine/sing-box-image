name: Sync Upstream & Build Docker

on:
  schedule:
    - cron: '0 18 * * *' # 每天北京时间凌晨 2:00 自动检查并构建
  workflow_dispatch:     # 网页上手动点击立即运行
  push:
    branches: [ main ]

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/fscarmen/sing-box.git
          git fetch upstream main
          git merge upstream/main --allow-unrelated-histories -m "Auto sync upstream" || git rebase upstream/main || true
          git push origin main || true

  build-and-push:
    needs: sync-upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 安装 QEMU（如果构建多架构必须开启，单架构也完全无害）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 构建并推送到 GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 自动清理保留最新的 10 个副本
      - name: Cleanup old container images (Keep 10)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-tagged: 10
          delete-untagged: true
          delete-partial-images: true
