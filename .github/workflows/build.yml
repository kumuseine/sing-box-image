name: Sync Upstream & Build Docker

on:
  schedule:
    - cron: '0 18 * * *' # 每天北京时间凌晨 2:00 自动检查并构建一次
  workflow_dispatch:     # 允许你在网页上手动点击按钮立即构建
  push:
    branches: [ main ]   # 当代码更新时触发

jobs:
  # 1. 自动同步上游最新代码
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/fscarmen/sing-box.git
          git fetch upstream main
          git merge upstream/main --allow-unrelated-histories -m "Auto sync upstream" || git rebase upstream/main || true
          git push origin main || true

  # 2. 构建 Docker 镜像并推送到 GHCR
  build-and-push:
    needs: sync-upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
